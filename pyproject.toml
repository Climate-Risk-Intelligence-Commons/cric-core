[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cric-core"
version = "0.1.0"
description = "Contract root of the Climate Risk Intelligence Commons (CRIC)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8", "build"]

[tool.hatch.build.targets.wheel]
packages = ["src/cric_core"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
