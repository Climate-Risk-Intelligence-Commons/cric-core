# GSD ingest manifest for CRIC PRD v0.1
#
# WHY THIS FILE EXISTS: /gsd-ingest-docs resolves doc-vs-doc conflicts with its own
# default precedence (ADR > SPEC > PRD > DOC). CRIC's precedence is different and is
# stated in CRIC-PRD-MASTER.md §Implementation Authority:
#   released cric-core contracts > Schema-and-Vocabulary-Registry > Master PRD >
#   specialised PRD documents > examples.
# Under the GSD default the Registry is just another PRD file and can silently lose a
# conflict to a specialised document, in the one artefact everything downstream reads.
#
# The mapping below is deliberately robust to BOTH resolution mechanisms:
#   - per-doc `precedence` integers (lower = higher precedence), AND
#   - type ordering alone (SPEC > PRD > DOC), in case the integers are not honoured.
# Registry = SPEC/0, Master = PRD/1, every specialised document = DOC/2. Either
# mechanism reproduces CRIC's own precedence.
#
# VERIFY AFTER RUNNING: .planning/INGEST-CONFLICTS.md must show the Registry winning
# any registry-vs-specialised-doc conflict. If it does not, the integers were ignored
# and the type mapping is what saved it -- say so rather than assuming.

docs:
  - path: docs/CRIC-PRD-v0.1/CRIC-Schema-and-Vocabulary-Registry.md
    type: SPEC
    precedence: 0   # authority precedence rank 2 - outranks every specialised doc
  - path: docs/CRIC-PRD-v0.1/CRIC-PRD-MASTER.md
    type: PRD
    precedence: 1   # authority precedence rank 3
  - path: docs/CRIC-PRD-v0.1/CRIC-Integration-Audit.md
    type: DOC
    precedence: 2
  - path: docs/CRIC-PRD-v0.1/CRIC-PRD-File-Manifest.md
